<head>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#e91e63">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Perfume Search App</title>
    <style>
        :root {
            --primary: #e91e63;
            --dark: #222;
            --light: #f8f9fa;
        }
        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--light);
            margin: 0;
            padding: 10px;
            color: var(--dark);
        }
        .header {
            text-align: center;
            padding: 20px 0;
            position: sticky;
            top: 0;
            background: var(--light);
            z-index: 100;
        }
        .search-box {
            width: 90%;
            max-width: 500px;
            padding: 15px 20px;
            border-radius: 30px;
            border: 2px solid var(--primary);
            font-size: 18px;
            outline: none;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        #results {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-top: 20px;
            padding-bottom: 50px;
        }
        .card {
            background: white;
            width: 95%;
            max-width: 450px;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
            margin-bottom: 25px;
            animation: slideUp 0.3s ease-out;
        }
        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card-img {
            width: 100%;
            height: 250px;
            object-fit: contain;
            background: #fff;
            padding: 10px;
        }
        .card-content {
            padding: 20px;
        }
        .brand {
            font-size: 14px;
            text-transform: uppercase;
            color: #777;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }
        .name {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 15px;
            color: var(--dark);
        }
        .code-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid #eee;
        }
        .code-row:last-child { border: none; }
        .size { font-weight: 600; color: var(--primary); }
        .code { font-family: monospace; font-size: 16px; background: #f0f0f0; padding: 2px 8px; border-radius: 4px; }
        .no-results { color: #999; margin-top: 50px; text-align: center; }
    </style>
</head>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');

</script>

        const searchInput = document.getElementById('search');
        const resultsDiv = document.getElementById('results');

        function performSearch() {
            const query = searchInput.value.toLowerCase().trim();
            resultsDiv.innerHTML = '';

            if (query === '') {
                resultsDiv.innerHTML = '<div class="no-results">Enter a search term to find products</div>';
                return;
            }

            const filtered = perfumes.filter(p => 
                p.id.toLowerCase().includes(query) || 
                p.name.toLowerCase().includes(query) ||
                p.brand.toLowerCase().includes(query)
            );

            if (filtered.length === 0) {
                resultsDiv.innerHTML = '<div class="no-results">No products found</div>';
                return;
            }

            filtered.forEach(p => {
                const card = document.createElement('div');
                card.className = 'card';
                
                let codesHtml = '';
                for (const [size, code] of Object.entries(p.codes)) {
                    codesHtml += `
                        <div class="code-row">
                            <span class="size">${size}</span>
                            <span class="code">${code}</span>
                        </div>`;
                }

                card.innerHTML = `
                    <img src="images/${p.id}.jpg" class="card-img" onerror="this.src='https://via.placeholder.com/400x250?text=${p.id}'">
                    <div class="card-content">
                        <div class="brand">${p.brand}</div>
                        <div class="name">#${p.id} ${p.name}</div>
                        <div class="codes-container">
                            ${codesHtml}
                        </div>
                    </div>
                `;
                resultsDiv.appendChild(card);
            });
        }

        searchInput.addEventListener('input', performSearch);
    </script>
</body>
</html>
